name: daq-navi-dev

services:
  daq-navi:
    build:
      context: ../..
    environment:
      LD_LIBRARY_PATH: /opt/advantech/libs:/usr/lib
      DAQ_CONFIG_PATH: /app/config/config.json
      DAQ_OPERATOR_USER: admin
      DAQ_OPERATOR_HASH: pbkdf2_sha256:100000:b5fa8a65cb0d3df701a753855dfc87c1:e4586d94fcfb275047e4704b5aa83ea0eb7240b42c65e9959ac2014386f3f684
      DAQ_OPERATOR_HASH_FILE: /var/lib/daq_navi/spool/operator_hash
      DAQ_SESSION_KEY: local-dev-session-key-change-before-sharing
      ALLOWED_ORIGINS: '*'
    ports:
      - "${DAQ_DEV_PORT:-18082}:8081"
    privileged: true
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /dev:/dev
      - /usr/lib:/usr/lib:ro
      - /opt/advantech:/opt/advantech:ro
      - /etc/biobdaq:/etc/biobdaq:ro
      - /var/lib/daq:/var/lib/daq:ro
      - ./config.template.json:/app/config.json:ro
      - ./config:/app/config
      - ./mqtt/ca.crt:/dev-mqtt/ca.crt:ro
      - daq_spool:/var/lib/daq_navi/spool
    depends_on:
      pg:
        condition: service_healthy
      influx:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pg:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: daq_navi_dev
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: testpass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d daq_navi_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 180s

  influx:
    image: influxdb:2.7
    ports:
      - "18086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword123
      DOCKER_INFLUXDB_INIT_ORG: mddp
      DOCKER_INFLUXDB_INIT_BUCKET: daq_telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: local-dev-token
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 180s

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "${GRAFANA_DEV_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      pg:
        condition: service_healthy
      influx:
        condition: service_healthy

  mqtt:
    image: eclipse-mosquitto:2
    command: ["/bin/sh", "-c", "if [ -f /mosquitto/data/passwordfile ]; then mosquitto_passwd -b /mosquitto/data/passwordfile tester testpass; else mosquitto_passwd -c -b /mosquitto/data/passwordfile tester testpass; fi && chown mosquitto:mosquitto /mosquitto/data/passwordfile && exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/ca.crt:/mosquitto/config/ca.crt:ro
      - ./mqtt/server.crt:/mosquitto/config/server.crt:ro
      - ./mqtt/server.key:/mosquitto/config/server.key:ro
      - mqtt_data:/mosquitto/data

volumes:
  daq_spool:
  pg_data:
  influx_data:
  influx_config:
  mqtt_data:
  grafana_data:
